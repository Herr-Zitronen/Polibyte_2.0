# Reconstrucción programada de producción (PR B). El sitio decide "próximo" o "realizado" al construirse:
# sin esto, un evento que ya pasó sigue como próximo hasta el siguiente deploy. Solo build + deploy de main,
# sin pruebas (el código ya pasó CI): ~2 min por corrida.
# Frecuencia: semanal, lunes 01:00 de Ecuador (06:00 UTC), decisión de Joel. Diaria: '0 6 * * *'. Solo manual: borra `schedule`.
name: Reconstrucción programada

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-main
  cancel-in-progress: true

jobs:
  rebuild:
    name: Build + deploy de main
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
